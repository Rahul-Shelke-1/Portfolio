<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahul Shelke</title>
  </head>
  <body class="relative bg-slate-950 text-white overflow-x-hidden">

    <div id="navbar-container"></div>

    <main class="flex-1">
      <div id="home-section"></div>
      

      <section id="project" class="relative max-w-7xl mx-auto px-4 sm:px-6 py-0 scroll-mt-28">
        <div class="text-center mb-10">
          <p class="text-sm uppercase tracking-[0.25em] text-cyan-400 mb-3">
            Selected Work
          </p>
          <h2 class="text-3xl sm:text-4xl font-bold text-white">
            Flagship Intelligence Systems
          </h2>
          <p class="mt-3 text-slate-400 max-w-2xl mx-auto">
            End-to-end systems spanning data engineering, analytics, machine learning,
    generative AI, and production infrastructure.
          </p>
        </div>

        <div
          id="flagship-projects-accordion"
          class="space-y-4"
        ></div>
      </section>


      <div id="about-section"></div>
      <div id="contact-section"></div>
    </main>

<dialog
  id="architecture-modal"
  class="m-auto w-[90vw] max-w-7xl h-[90vh]
         rounded-2xl
         border border-purple-500/30
         shadow-[0_0_60px_rgba(168,85,247,0.25)]
         bg-slate-950"
>
    <div class="flex flex-col h-full">

      <!-- Header -->
      <div class="flex items-center justify-between p-5 border-b border-slate-800">

        <h2
          id="architecture-title"
          class="text-2xl font-bold text-white"
        ></h2>

        <button
          onclick="closeArchitecture()"
          class="text-slate-400 hover:text-white text-3xl leading-none"
        >
          ×
        </button>

      </div>

      <!-- Image Area -->
      <div class="flex-1 flex items-center justify-center gap-4 p-6">

        <!-- Previous -->
        <button
          onclick="previousArchitecture()"
          class="text-white text-3xl hover:text-purple-400 transition px-4"
        >
          ◀
        </button>

        <!-- Current Image -->
        <div
          id="architecture-viewer"
          class="flex-1 flex items-center justify-center"
        >
          <img
            src="..."
            class="max-w-full max-h-[70vh] object-contain rounded-xl"
          />
        </div>

        <!-- Next -->
        <button
          onclick="nextArchitecture()"
          class="text-white text-3xl hover:text-purple-400 transition px-4"
        >
          ▶
        </button>

      </div>

      <!-- Pagination Dots -->
      <div
        id="architecture-pagination"
        class="flex justify-center gap-2 pb-5"
      >
      </div>

    </div>
  </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>

    <!-- Background Effects -->
  <div class="absolute inset-0 -z-10 overflow-hidden">

    <!-- Purple Glow -->
    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-purple-600/20 blur-[120px] rounded-full"></div>

    <!-- Cyan Glow -->
    <div class="absolute bottom-0 right-1/4 w-[400px] h-[400px] bg-cyan-500/10 blur-[120px] rounded-full"></div>

    <!-- Grid Overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:60px_60px]"></div>

  </div>
</html>
